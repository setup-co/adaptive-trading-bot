[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adaptive-trading-bot"
version = "0.1.0"
description = "Safety-first foundation for the Adaptive Trading Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "ccxt>=4.5,<5",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "pyarrow>=25.0,<26",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
atb-import-ohlcv = "adaptive_trading_bot.market_data.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pyarrow-stubs>=20.0.0.20260819,<21",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_trading_bot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adaptive_trading_bot"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true
