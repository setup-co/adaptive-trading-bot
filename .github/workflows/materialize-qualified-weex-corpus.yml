name: Materialize qualified WEEX corpus

on:
  push:
    branches:
      - issue-115-weex-qualified-corpus
    paths:
      - .github/workflows/materialize-qualified-weex-corpus.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-115-weex-qualified-corpus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Rebuild candidate snapshot from WEEX
        run: |
          rm -rf .materialized-weex
          atb-build-weex-corpus \
            --output-root .materialized-weex \
            --source-code-commit defbf035481b126f590bec093e0d5e36867bb7bc \
            --built-at 2026-09-15T18:00:00Z
      - name: Verify exact approved artifacts and stage durable snapshot
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          version = "weex-v1-5m-last-a629a29b580b2e103adba918"
          manifest_sha = "98705bd49ec05f912ef6c0257ea9a9886b706f3c80ca84c82faace4e20415e95"
          approved_path = Path("docs/research/manifests") / f"{version}.json"
          approved = json.loads(approved_path.read_text(encoding="utf-8"))
          source = Path(".materialized-weex")
          expected = {item["path"]: item for item in approved["artifacts"]}
          actual = {path.relative_to(source).as_posix() for path in source.rglob("*.parquet")}
          if actual != set(expected):
              missing = sorted(set(expected) - actual)
              extra = sorted(actual - set(expected))
              raise SystemExit(f"artifact path mismatch: missing={missing} extra={extra}")

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          for relative, metadata in sorted(expected.items()):
              candidate = source / relative
              if candidate.stat().st_size != metadata["size_bytes"]:
                  raise SystemExit(f"approved artifact size mismatch: {relative}")
              if digest(candidate) != metadata["sha256"]:
                  raise SystemExit(f"approved artifact SHA-256 mismatch: {relative}")

          target = Path("data/research_corpus") / version
          if target.exists():
              shutil.rmtree(target)
          for relative in sorted(expected):
              destination = target / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source / relative, destination)
          shutil.copyfile(approved_path, target / "manifest.json")
          if digest(target / "manifest.json") != manifest_sha:
              raise SystemExit("approved manifest SHA-256 mismatch after copy")
          print(f"verified and staged {len(expected)} immutable artifacts")
          PY
      - name: Verify locked reader over staged snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          from adaptive_trading_bot.research.weex_historical_corpus import LockedWeexResearchCorpusStore

          version = "weex-v1-5m-last-a629a29b580b2e103adba918"
          root = Path("data/research_corpus") / version
          store = LockedWeexResearchCorpusStore(root, dataset_version=version)
          print(f"locked source verified: {store.source_id.value}")
          PY
      - name: Commit exact approved snapshot
        run: |
          git config user.name "setup-co"
          git config user.email "300564667+setup-co@users.noreply.github.com"
          git add data/research_corpus/weex-v1-5m-last-a629a29b580b2e103adba918
          if git diff --cached --quiet; then
            echo "approved snapshot is already committed"
            exit 0
          fi
          git commit -m "Store qualified WEEX corpus snapshot"
          git push origin HEAD:issue-115-weex-qualified-corpus
