[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adaptive-trading-bot"
version = "0.1.0"
description = "Safety-first foundation for the Adaptive Trading Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "ccxt>=4.5,<5",
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "numpy==2.3.5",
  "pydantic-settings>=2.7,<3",
  "pyarrow>=25.0,<26",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
atb-import-ohlcv = "adaptive_trading_bot.market_data.cli:main"
atb-replay = "adaptive_trading_bot.replay.cli:main"
atb-research-corpus = "adaptive_trading_bot.research.cli:main"
atb-research-exit-robustness = "adaptive_trading_bot.research.trend_pullback_exit_robustness:main"
atb-build-weex-corpus = "adaptive_trading_bot.research.weex_historical_corpus:main"
atb-build-weex-leveraged-inputs = "adaptive_trading_bot.research.weex_leveraged_inputs:main"
atb-capture-weex-forward-evidence = "adaptive_trading_bot.research.weex_forward_evidence:main"
atb-calibrate-weex-demo-long = "adaptive_trading_bot.research.weex_demo_calibration:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pyarrow-stubs>=20.0.0.20260819,<21",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_trading_bot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# Exact captured diagnostic sources: preserve their original bytes and recorded hashes.
exclude = [
  "data/research_evidence/issue-206-weex-history-probe-3884cf7/probe.py",
  "data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-audit.py",
  "data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-audit-v2.py",
  "data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-inventory-audit-v1.py",
  "data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-inventory-audit.py",
  "data/research_evidence/issue-220-history-screened-180d-recovery-d09e50f3/execution/*.py",
  "data/research_evidence/issue-220-history-screened-180d-recovery-d09e50f3/recovery/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Retained external diagnostics are immutable evidence; keep all other lint rules active.
# Issue #212's captured reconciliation source is immutable evidence.
"data/research_evidence/issue-212-overlap-reconciliation-v1/reconcile.py" = ["SIM102"]
"data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-audit*.py" = ["E501"]
"data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-audit.py" = ["F841"]
"data/research_evidence/issue-214-history-screened-partial-3cc2f47/partial-inventory-audit*.py" = ["E501"]
"data/research_evidence/issue-220-history-screened-180d-recovery-d09e50f3/execution/*.py" = ["E501", "F401", "UP017"]
"data/research_evidence/issue-220-history-screened-180d-recovery-d09e50f3/recovery/*.py" = ["E501", "F401", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adaptive_trading_bot"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*"]
ignore_missing_imports = true
