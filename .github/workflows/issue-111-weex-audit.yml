name: Issue 111 WEEX Recent 5m Audit

on:
  push:
    branches:
      - issue-111-weex-recent-clean-window-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile audit runner
        run: python -m py_compile scripts/research/weex_recent_5m_audit.py

      - name: Run bounded WEEX audit
        run: python scripts/research/weex_recent_5m_audit.py

      - name: Hash evidence
        run: sha256sum .audit/issue-111/* | tee .audit/issue-111/SHA256SUMS.txt

      - name: Show concise summary
        run: cat .audit/issue-111/summary.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-111-weex-recent-5m-audit
          path: .audit/issue-111/
          if-no-files-found: error
          retention-days: 30
